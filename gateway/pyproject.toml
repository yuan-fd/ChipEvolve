[build-system]
requires = ["setuptools>=59.4"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-platform-gateway"
version = "0.1.0"
description = "Integration entry point: identity, routing, navigation"
requires-python = ">=3.9"
dependencies = [
  "openroad-platform-contracts",
  "openroad-platform-runtime",
  "openroad-platform-registry",
  "openroad-platform-evaluator",
  "openroad-platform-provenance",
  "openroad-platform-identity",
]

[project.scripts]
openroad-platform-gateway = "openroad_platform_gateway.__main__:main"
openroad-platform-worker = "openroad_platform_gateway.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openroad_platform_gateway*"]
