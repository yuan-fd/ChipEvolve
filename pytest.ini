[pytest]
testpaths =
    apps/dse_lab/src
    apps/plan_executor/src
    guardrails
    contracts/tests
    tests
    apps
pythonpath =
    contracts/src
    core/runtime/src
    core/registry/src
    gateway/src
    core/client/src
    core/evaluator/src
    core/provenance/src
    core/identity/src
    apps/query_agent/src
    apps/dse_lab/src
    apps/plan_executor/src
