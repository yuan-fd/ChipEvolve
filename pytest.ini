[pytest]
testpaths =
    guardrails
    contracts/tests
    core/tests
    apps
pythonpath =
    contracts/src
    core/runtime/src
    core/registry/src
    core/evaluator/src
    core/provenance/src
    core/identity/src
    core/client/src
    guardrails
addopts = -ra --strict-markers
markers =
    real_eda: touches a real EDA toolchain; not run in the default suite
