[pytest]
testpaths = tests
addopts = -m "not real_3d"
pythonpath =
    packages/contracts/src
    packages/execution/src
    packages/scheduler/src
    packages/analysis/src
    packages/visualization/src
markers =
    real_3d: real TaiWei/OpenROAD 3D end-to-end validation; run explicitly in serialized nightly CI
