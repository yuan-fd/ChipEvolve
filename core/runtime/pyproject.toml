[build-system]
requires = ["setuptools>=59.4"]
build-backend = "setuptools.build_meta"

[project]
name = "openroad-platform-runtime"
version = "0.1.0"
description = "Runtime kernel: durable run state, process supervision, protected evaluation boundary"
requires-python = ">=3.9"
dependencies = ["openroad-platform-contracts"]

[project.scripts]
openroad-platform-runtime = "openroad_platform_runtime.cli:main"
openroad-platform-worker = "openroad_platform_runtime.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["openroad_platform_runtime*"]
